spring.application.name=finledger

# Active Profile (defaults to 'dev' for local developer environments; set SPRING_PROFILES_ACTIVE=prod in production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server.port=8080

# MySQL 8 DataSource Configuration (override via SPRING_DATASOURCE_* in containerized/prod environments)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CORS & API Documentation Configuration
finledger.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://192.168.1.201:4200,http://103.199.210.172:4200}
finledger.swagger.enabled=${SWAGGER_ENABLED:true}

# Actuator Health Probe
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Multipart Upload Configuration (10MB limit per attachment per specification)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Storage & Expense Configuration
finledger.storage.local-dir=./uploads
finledger.attachments.base-path=${FINLEDGER_ATTACHMENTS_BASE_PATH:${finledger.storage.local-dir}}
finledger.expense.finance-approval-threshold=2000.00

# Mail Delivery Configuration (disabled by default in dev/test via NoOpMailService)
finledger.mail.enabled=${FINLEDGER_MAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

# File Storage Configuration (local or s3)
finledger.storage.type=${FINLEDGER_STORAGE_TYPE:local}
finledger.storage.s3.bucket=${FINLEDGER_STORAGE_S3_BUCKET:finledger-attachments}
finledger.storage.s3.region=${FINLEDGER_STORAGE_S3_REGION:us-east-1}
finledger.storage.s3.endpoint=${FINLEDGER_STORAGE_S3_ENDPOINT:}
