spring.application.name=finledger

# Server Configuration
server.port=8080

# MySQL 8 DataSource Configuration (override via SPRING_DATASOURCE_* in containerized/prod environments)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://192.168.1.110:3306/finledger_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:akshai}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Actuator Health Probe
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Multipart Upload Configuration (10MB limit per attachment per specification)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Storage & Expense Configuration
finledger.storage.local-dir=./uploads
finledger.attachments.base-path=${FINLEDGER_ATTACHMENTS_BASE_PATH:${finledger.storage.local-dir}}
finledger.expense.finance-approval-threshold=2000.00
